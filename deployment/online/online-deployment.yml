# =============================================================================
# Azure ML Online Deployment Configuration
# Patient No-Show Risk Scoring - Blue Deployment
# =============================================================================
#
# Deploy with:
#   az ml online-deployment create -f online-deployment.yml
# =============================================================================

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json

name: blue
endpoint_name: noshow-online-endpoint
description: |
  Blue deployment for real-time no-show risk scoring.
  CPU-optimized for cost-effective operation.

# Model reference
model: azureml:noshow-logreg@latest

# Scoring configuration
code_configuration:
  code: ./src
  scoring_script: score_online.py

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
  conda_file: ./environment.yml

# Compute configuration (CPU - cost effective)
instance_type: Standard_DS3_v2
instance_count: 1

# Scaling settings
scale_settings:
  type: default

# Liveness and readiness probes
liveness_probe:
  initial_delay: 10
  period: 10
  timeout: 2
  success_threshold: 1
  failure_threshold: 30

readiness_probe:
  initial_delay: 10
  period: 10
  timeout: 2
  success_threshold: 1
  failure_threshold: 30

# Request settings
request_settings:
  request_timeout_ms: 3000
  max_concurrent_requests_per_instance: 100
  max_queue_wait_ms: 500

# Environment variables
environment_variables:
  PREDICTION_THRESHOLD: "0.7"
  MODEL_VERSION: "v1"
  LOG_LEVEL: "INFO"

tags:
  deployment_type: blue
  framework: scikit-learn
