# =============================================================================
# No-Show Prediction - Code Quality Template
# =============================================================================
# Reusable template for code quality checks (linting, testing, security).
#
# Following MLOpsPython template: https://github.com/microsoft/MLOpsPython
# =============================================================================

parameters:
  - name: pythonVersion
    type: string
    default: '3.9'

steps:
  # Setup Python
  - task: UsePythonVersion@0
    displayName: 'Use Python ${{ parameters.pythonVersion }}'
    inputs:
      versionSpec: '${{ parameters.pythonVersion }}'

  # Install dependencies
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install flake8 pytest pytest-cov bandit safety
    displayName: 'Install dependencies'

  # Code linting
  - script: |
      flake8 noshow_prediction/ ml_service/ --count --select=E9,F63,F7,F82 --show-source --statistics
      flake8 noshow_prediction/ ml_service/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    displayName: 'Lint with flake8'
    continueOnError: true

  # Security check
  - script: |
      bandit -r noshow_prediction/ -ll
    displayName: 'Security check with bandit'
    continueOnError: true

  # Dependency vulnerability check
  - script: |
      safety check --full-report
    displayName: 'Check dependencies for vulnerabilities'
    continueOnError: true

  # Run unit tests
  - script: |
      pytest tests/ -v --cov=noshow_prediction --cov-report=xml --cov-report=html --junitxml=test-results.xml
    displayName: 'Run unit tests'

  # Publish test results
  - task: PublishTestResults@2
    displayName: 'Publish test results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results.xml'
      failTaskOnFailedTests: true

  # Publish code coverage
  - task: PublishCodeCoverageResults@1
    displayName: 'Publish code coverage'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: 'coverage.xml'
      reportDirectory: 'htmlcov'
