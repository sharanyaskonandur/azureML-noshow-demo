# =============================================================================
# No-Show Prediction MLOps - Variables Template
# =============================================================================
# This file defines variables used across CI/CD pipelines.
# Copy and customize for your environment.
#
# Following MLOpsPython template: https://github.com/microsoft/MLOpsPython
# =============================================================================

variables:

  # =============================================================================
  # Azure ML Configuration
  # =============================================================================
  
  # Azure ML Workspace
  - name: SUBSCRIPTION_ID
    value: '8a7af4dd-523e-4175-b231-d31d36752280'
  
  - name: RESOURCE_GROUP
    value: 'rg-ai-hub-citadel-dev-02'
  
  - name: WORKSPACE_NAME
    value: 'AI-WORKSPACE-shark'
  
  # Compute
  - name: COMPUTE_NAME
    value: 'cpu-cluster'
  
  # =============================================================================
  # Dataset Configuration
  # =============================================================================
  
  - name: DATASET_NAME
    value: 'noshow-appointments-kaggle'
  
  - name: DATASTORE_NAME
    value: 'workspaceblobstore'
  
  # =============================================================================
  # Model Configuration
  # =============================================================================
  
  - name: MODEL_NAME
    value: 'noshow-logreg'
  
  - name: MODEL_VERSION
    value: 'latest'
  
  # =============================================================================
  # Endpoint Configuration
  # =============================================================================
  
  - name: ONLINE_ENDPOINT_NAME
    value: 'noshow-online-endpoint'
  
  - name: BATCH_ENDPOINT_NAME
    value: 'noshow-batch-endpoint'
  
  # =============================================================================
  # Pipeline Configuration
  # =============================================================================
  
  # Set to 'false' to skip evaluation step
  - name: RUN_EVALUATION
    value: 'true'
  
  # Minimum AUC required for model to pass evaluation
  - name: MIN_AUC_THRESHOLD
    value: '0.70'
  
  # =============================================================================
  # Environment Configuration
  # =============================================================================
  
  - name: ENVIRONMENT_NAME
    value: 'noshow-training-env'
  
  - name: PYTHON_VERSION
    value: '3.9'
  
  # =============================================================================
  # Build Agent Configuration
  # =============================================================================
  
  - name: AGENT_POOL
    value: 'Azure Pipelines'
  
  - name: VM_IMAGE
    value: 'ubuntu-latest'
