# =============================================================================
# No-Show Prediction - GitHub Actions CI/CD
# =============================================================================
# Workflow: Tests → Train Model → Deploy Staging → Deploy Production
# =============================================================================

name: MLOps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'noshow_prediction/**'
      - 'ml_service/**'
      - 'deployment/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'

jobs:
  # ===========================================================================
  # Job 1: Code Quality & Tests
  # ===========================================================================
  code-quality:
    name: 🧪 Code Quality & Tests
    runs-on: [self-hosted, linux]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn pandas numpy joblib pytest pytest-cov
      
      - name: Run unit tests
        run: |
          pytest noshow_prediction/training/test_train.py -v

  # ===========================================================================
  # Job 2: Train & Register Model (main branch only)
  # ===========================================================================
  train-model:
    name: 🚂 Train & Register Model
    runs-on: [self-hosted, linux]
    needs: code-quality
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn pandas numpy joblib
      
      - name: Train model locally
        run: |
          cd noshow_prediction/training
          python train.py --data-path ../../data/KaggleV2-May-2016.csv --output-dir ../../outputs
      
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az extension add --name ml --yes
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      
      - name: Register model in Azure ML
        run: |
          az ml model create \
            --name noshow-logreg \
            --path outputs/ \
            --resource-group ${{ vars.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ vars.AZURE_ML_WORKSPACE }} \
            --type custom_model \
            --description "No-show prediction model trained on $(date)"
          echo "✅ Model registered"

  # ===========================================================================
  # Job 3: Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: 🎭 Deploy to Staging
    runs-on: [self-hosted, linux]
    needs: train-model
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az extension add --name ml --yes
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      
      - name: Deploy to Staging Endpoint
        run: |
          # Create endpoint if not exists
          az ml online-endpoint create \
            --name noshow-online-endpoint-staging \
            --resource-group ${{ vars.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ vars.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-endpoint.yml \
            --set name=noshow-online-endpoint-staging || true
          
          # Deploy model
          az ml online-deployment create \
            --name blue \
            --endpoint-name noshow-online-endpoint-staging \
            --resource-group ${{ vars.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ vars.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-deployment.yml \
            --all-traffic || true
          
          echo "✅ Staging deployment complete"

  # ===========================================================================
  # Job 4: Deploy to Production (with approval)
  # ===========================================================================
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: [self-hosted, linux]
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az extension add --name ml --yes
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      
      - name: Deploy to Production Endpoint
        run: |
          # Create endpoint if not exists
          az ml online-endpoint create \
            --name noshow-online-endpoint \
            --resource-group ${{ vars.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ vars.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-endpoint.yml || true
          
          # Blue-green deployment
          az ml online-deployment create \
            --name blue-${{ github.run_number }} \
            --endpoint-name noshow-online-endpoint \
            --resource-group ${{ vars.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ vars.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-deployment.yml \
            --all-traffic || true
          
          echo "✅ Production deployment complete"
