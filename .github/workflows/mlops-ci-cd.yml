# =============================================================================
# No-Show Prediction - GitHub Actions CI/CD
# =============================================================================
# Alternative to Azure DevOps pipelines for GitHub-based MLOps.
#
# Following MLOpsPython template: https://github.com/microsoft/MLOpsPython
# =============================================================================

name: MLOps CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'noshow_prediction/**'
      - 'ml_service/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.9'
  AZURE_ML_RESOURCE_GROUP: ${{ secrets.AZURE_ML_RESOURCE_GROUP }}
  AZURE_ML_WORKSPACE: ${{ secrets.AZURE_ML_WORKSPACE }}

jobs:
  # ===========================================================================
  # Job 1: Code Quality & Tests
  # ===========================================================================
  code-quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov
      
      - name: Lint with flake8
        run: |
          flake8 noshow_prediction/ ml_service/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 noshow_prediction/ ml_service/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Run unit tests
        run: |
          pytest tests/ noshow_prediction/training/test_train.py -v --cov=noshow_prediction --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Job 2: Train Model (main branch only)
  # ===========================================================================
  train-model:
    name: Train Model
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Submit Training Pipeline
        run: |
          python ml_service/pipelines/noshow_build_train_pipeline.py \
            --compute-name cpu-cluster \
            --env-name noshow-training-env \
            --dataset-name noshow-appointments-kaggle
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ secrets.AZURE_ML_RESOURCE_GROUP }}
          WORKSPACE_NAME: ${{ secrets.AZURE_ML_WORKSPACE }}

  # ===========================================================================
  # Job 3: Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: train-model
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Staging Endpoint
        run: |
          az ml online-endpoint create \
            --name noshow-online-endpoint-staging \
            --resource-group ${{ secrets.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-endpoint.yml \
            --set name=noshow-online-endpoint-staging || true
          
          az ml online-deployment create \
            --name blue \
            --endpoint-name noshow-online-endpoint-staging \
            --resource-group ${{ secrets.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-deployment.yml \
            --all-traffic

  # ===========================================================================
  # Job 4: Smoke Tests
  # ===========================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Run Smoke Tests
        run: |
          python ml_service/util/smoke_test_scoring_service.py \
            --endpoint-name noshow-online-endpoint-staging
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ secrets.AZURE_ML_RESOURCE_GROUP }}
          WORKSPACE_NAME: ${{ secrets.AZURE_ML_WORKSPACE }}

  # ===========================================================================
  # Job 5: Deploy to Production (with approval)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: github.ref == 'refs/heads/main'
    environment: production  # Requires approval in GitHub settings
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Production Endpoint
        run: |
          az ml online-endpoint create \
            --name noshow-online-endpoint \
            --resource-group ${{ secrets.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-endpoint.yml || true
          
          az ml online-deployment create \
            --name blue-${{ github.run_number }} \
            --endpoint-name noshow-online-endpoint \
            --resource-group ${{ secrets.AZURE_ML_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AZURE_ML_WORKSPACE }} \
            --file deployment/online/online-deployment.yml \
            --all-traffic
